{% extends 'base.html' %}
{% block content %}
<div class="form-card">
  <h2>Add Menu Item — {{ restaurant.name }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label>{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Save Item</button>
  </form>
</div>
{% endblock %}
