{% extends 'base.html' %}
{% block content %}
<section class="section container" style="text-align:center;">
  <span class="hero-eyebrow" style="background: var(--basil); color:#fff; border:none;">Order confirmed</span>
  <h2>Thanks — Order #{{ order.id }} is on its way to the kitchen 🍳</h2>
  <p class="muted">We'll notify you as {{ order.restaurant.name }} updates your order.</p>
  <a href="{% url 'orders:track_order' order.pk %}" class="btn btn-primary">Track Order</a>
</section>
{% endblock %}
