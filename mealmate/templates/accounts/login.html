{% extends 'base.html' %}
{% block content %}
<div class="form-card">
  <h2>Welcome back</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label>{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Login</button>
  </form>
  <p class="form-footer">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</div>
{% endblock %}
