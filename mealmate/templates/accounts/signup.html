{% extends 'base.html' %}
{% block content %}
<div class="form-card">
  <h2>Create your MealMate account</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label>{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}
      </div>
    {% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Sign Up</button>
  </form>
  <p class="form-footer">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
